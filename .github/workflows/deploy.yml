# ============================================================
# Pubblicazione automatica su Vercel.
#
# A ogni push su `main` questo lavoro ricostruisce il sito e lo
# manda in produzione. Sostituisce il collegamento diretto fra
# Vercel e GitHub, che richiederebbe di installare la GitHub App
# di Vercel sull'account proprietario del repository.
#
# Le tre voci in `secrets` si impostano una volta sola in
# GitHub → Settings → Secrets and variables → Actions.
# `VERCEL_TOKEN` si genera su vercel.com/account/tokens.
#
# Il lavoro parte solo dai push diretti su `main`: le pull request,
# comprese quelle da fork, non possono leggere i secret.
# ============================================================
name: Deploy su Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa la CLI di Vercel
        run: npm install --global vercel@latest

      - name: Scarica la configurazione del progetto
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Compila
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Pubblica
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
