<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IDROS Milano Marittima</title>
<meta name="description" content="IDROS, Milano Marittima. Il nuovo sito è in arrivo.">
<!-- Pagina provvisoria: non deve finire nei risultati di ricerca -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/icon-192.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300&display=swap">
<style>
/* Stessi valori di assets/css/style.css, ripetuti qui perché la
   pagina sta in piedi da sola. Percorsi assoluti: il filtro di
   middleware.js la serve a qualunque indirizzo, anche /qualcosa/altro. */
:root{
  --black:#000000;
  --white:#FFFFFF;
  --dim:#B4B4B4;
  --muted:#9A9A9A;
  --wine-lt:#DB4756;
  --line:rgba(255,255,255,.22);
  --font:"gill-sans-nova","Gill Sans Nova","Gill Sans","GillSans",
         "Gill Sans MT","Jost",-apple-system,BlinkMacSystemFont,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--black);color:var(--white);
  font-family:var(--font);font-weight:300;line-height:1.7;
  -webkit-font-smoothing:antialiased;
  display:grid;place-items:center;
  padding:2rem 1rem;
}
.wait{display:flex;flex-direction:column;align-items:center;text-align:center}

/* Logo: stesso ritaglio del piè di pagina, marchio e dicitura (y 489-1253) */
.logoclip{--s:.2;position:relative;overflow:hidden;margin:0;
  width:calc(1866px * var(--s));height:calc(769px * var(--s))}
.logoclip img{
  position:absolute;display:block;max-width:none;
  width:calc(2846px * var(--s));
  left:calc(-490px * var(--s));
  top:calc(-487px * var(--s));
}
@media(max-width:600px){.logoclip{--s:.15}}

.rule{width:3rem;height:1px;background:var(--line);margin:2.75rem 0 2rem}
.eyebrow{
  margin:0;font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;
  color:var(--wine-lt);padding-left:.32em;
}
.en{margin:.35rem 0 0;font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;
  color:var(--muted);padding-left:.32em}
.mail{
  margin-top:2.25rem;font-size:1.05rem;color:var(--dim);text-decoration:none;
  border-bottom:1px solid var(--line);padding-bottom:.15rem;
  transition:color 280ms var(--ease),border-color 280ms var(--ease);
}
.mail:hover,.mail:focus-visible{color:var(--white);border-color:var(--white)}
.mail:focus-visible{outline:1px solid var(--white);outline-offset:6px}

@media(prefers-reduced-motion:no-preference){
  .wait>*{opacity:0;transform:translateY(14px);
    animation:rise 1.2s var(--ease) forwards}
  .wait>:nth-child(2){animation-delay:.25s}
  .wait>:nth-child(3){animation-delay:.4s}
  .wait>:nth-child(4){animation-delay:.5s}
  .wait>:nth-child(5){animation-delay:.65s}
  @keyframes rise{to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<main class="wait">
  <h1 class="logoclip"><img src="/assets/img/logo.png" alt="IDROS Milano Marittima"></h1>
  <span class="rule" aria-hidden="true"></span>
  <p class="eyebrow">Il nuovo sito è in arrivo</p>
  <p class="en" lang="en">Our new website is coming soon</p>
  <a class="mail" href="mailto:info@idrosmilanomarittima.it">info@idrosmilanomarittima.it</a>
</main>
</body>
</html>
